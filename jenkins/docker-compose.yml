# Local Jenkins for the CI pipelines (telecom-backend/Jenkinsfile, telecom-frontend/Jenkinsfile)
#   docker compose -f jenkins/docker-compose.yml up -d --build
services:
  jenkins:
    build: .
    image: telecom-jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    # The socket is root:root 660 on Docker Desktop; root group lets the jenkins user use it
    group_add:
      - "0"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  # Existing volume holding jobs, plugins and credentials
  jenkins_home:
    external: true
