name: telecom-gis

services:
  # ── PostgreSQL 16 + PostGIS ────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-telecom_gis}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once, only when the volume is empty: schema (+ PostGIS) then network data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5434}:5432"
    healthcheck:
      # TCP check: the init-time server is socket-only, so this passes only once
      # the init scripts have finished and the real server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ── Express / TypeScript API ───────────────────────────────────────────────
  backend:
    build: ./telecom-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # JWT_SECRET, EMAIL_*, ANTHROPIC_API_KEY, ... (optional file)
      - path: ./telecom-backend/.env
        required: false
    environment:
      # These override the local-dev values from telecom-backend/.env
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-telecom_gis}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-5000}:5000"

  # ── React app served by nginx (proxies /api → backend) ─────────────────────
  frontend:
    build:
      context: ./telecom-frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  db_data:
